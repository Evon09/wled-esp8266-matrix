[platformio]
default_envs = d1_r2_gif

; Wemos D1 R2 v2.1.0 = ESP8266 (ESP-12F), 4MB flash
; GIF no ESP8266: usa lowram_libs/AnimatedGIF (fork com tabelas LZW reduzidas, ver GIF_LOW_RAM)
[env:d1_r2_gif]
extends = env:nodemcuv2
board = d1_mini
build_flags = ${common.build_flags} ${esp8266.build_flags} -D WLED_RELEASE_NAME=\"D1R2_GIF\"
  -D WLED_DISABLE_PARTICLESYSTEM2D
  -D WLED_ENABLE_GIF
  -D GIF_LOW_RAM
  -D GIF_CODE_LIMIT=576  ; entradas do dicionario LZW: 576 = quadros ate 318 px (16x16, 32x8), decodificador ~7,3KB | 1024 = ate 766 px (32x16), ~9KB
  -D WLED_DISABLE_ALEXA
  -D WLED_DISABLE_HUESYNC
  -D WLED_DISABLE_INFRARED
  -D WLED_DISABLE_ADALIGHT  ; entrada de cores pela USB (Prismatik/Hyperion): nao usado
  -D WLED_DISABLE_LOXONE    ; integracao Loxone: nao usado. MQTT continua ligado
custom_usermods = mqtt_rules game_relay
  ; mqtt_rules: regras MQTT em /mqttrules.jsonl; game_relay: repassa comandos entre aparelhos nos jogos
lib_extra_dirs = lowram_libs  ; AnimatedGIF (tabelas reduzidas) e GifDecoder (architectures=*, o original so declara avr/esp32)
lib_deps = ${esp8266.lib_deps}

; mesmo firmware, com logs na serial (115200)
[env:d1_r2_gif_debug]
extends = env:d1_r2_gif
build_flags = ${env:d1_r2_gif.build_flags}
  -D WLED_DEBUG

; mesmo firmware, logs enviados por UDP para o PC (porta 7868), sem USB
[env:d1_r2_gif_netdebug]
extends = env:d1_r2_gif_debug
build_flags = ${env:d1_r2_gif_debug.build_flags}
  -D WLED_DEBUG_HOST=\"192.168.0.79\"

; firmware final de teste: sem WLED_DEBUG, com log dos GIFs em http://IP-da-placa/giflog
[env:d1_r2_gif_log]
extends = env:d1_r2_gif
build_flags = ${env:d1_r2_gif.build_flags}
  -D GIF_LOG
